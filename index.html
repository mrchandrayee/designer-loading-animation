<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b2a">
  <title>Designer Loading Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <span class="tag">CSS / SCSS EXPERIMENT</span>
      <h1>Designer Loading Animation</h1>
      <p>A morphing particle loader with a shifting color canvas.</p>
    </header>

    <section class="stage" aria-label="Animated particle loading preview">
      <div class="loader" id="loader" role="img" aria-label="Rotating and morphing particle animation"></div>
      <span class="stage-caption">LOADING EXPERIENCE</span>
    </section>

    <div class="controls">
      <button id="toggle" type="button" aria-pressed="false">Pause animation</button>
      <button id="replay" type="button">Replay</button>
    </div>
    <footer>Built with HTML, CSS animations and a small JavaScript particle generator.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
